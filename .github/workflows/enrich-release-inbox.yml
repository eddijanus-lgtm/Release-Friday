name: Enrich Release Inbox

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/enrich-release-inbox.mjs"
      - "scripts/enrich-release-inbox.test.mjs"
      - "scripts/fetch-releases.mjs"
      - "supabase/functions/release-friday-import/index.ts"
      - ".github/workflows/enrich-release-inbox.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/enrich-release-inbox.mjs"
      - "scripts/fetch-releases.mjs"
      - "supabase/functions/release-friday-import/index.ts"
      - ".github/workflows/enrich-release-inbox.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional active Release Inbox run UUID
        required: false
        type: string
      release_date:
        description: Optional release date in YYYY-MM-DD format
        required: false
        type: string
      allow_artist_image_fallback:
        description: Allow an exact Spotify artist-image fallback before the normal cutoff
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-inbox-enrichment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and test inbox enrichment
        run: |
          node --check scripts/fetch-releases.mjs
          node --check scripts/enrich-release-inbox.mjs
          node --test scripts/enrich-release-inbox.test.mjs

  enrich:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_IMPORT_RUN_ID: ${{ inputs.run_id }}
      RELEASE_DATE: ${{ inputs.release_date }}
      ALLOW_SPOTIFY_ARTIST_IMAGE_FALLBACK: ${{ inputs.allow_artist_image_fallback }}
      SPOTIFY_COVER_QUERY_LIMIT: 1
      APPLE_COVER_QUERY_LIMIT: 1
      SPOTIFY_REQUEST_INTERVAL_MS: 350
      APPLE_REQUEST_INTERVAL_MS: 350
      SPOTIFY_RATE_LIMIT_MAX_WAIT_MS: 60000
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SUPABASE_URL: https://otjvkorslczqdpzltjpj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich pending Inbox covers and links
        run: node scripts/enrich-release-inbox.mjs
